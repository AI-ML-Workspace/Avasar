<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="agri-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="100%" stop-color="#0F2B22" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#agri-bg)" rx="16" />
  <circle cx="200" cy="120" r="90" fill="#2E6B56" opacity="0.3" />
  <circle cx="200" cy="120" r="60" fill="#3D8B70" opacity="0.2" />
  <!-- Sun -->
  <circle cx="200" cy="80" r="28" fill="url(#gold-grad)" opacity="0.9" />
  <!-- Mountain / Field Silhouettes -->
  <path d="M 50 200 Q 130 140 200 160 Q 270 140 350 200 Z" fill="#205844" />
  <path d="M 20 220 Q 120 165 200 185 Q 280 165 380 220 Z" fill="#133A2D" />
  <!-- Wheat Stalk / Sprout -->
  <g transform="translate(180, 75) scale(0.9)">
    <path d="M 22 70 Q 22 20 22 0" stroke="#FFD700" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 22 25 Q 40 15 35 3" fill="url(#gold-grad)" />
    <path d="M 22 25 Q 4 15 9 3" fill="url(#gold-grad)" />
    <path d="M 22 45 Q 42 35 38 23" fill="url(#gold-grad)" />
    <path d="M 22 45 Q 2 35 6 23" fill="url(#gold-grad)" />
    <path d="M 22 65 Q 40 55 36 43" fill="url(#gold-grad)" />
    <path d="M 22 65 Q 4 55 8 43" fill="url(#gold-grad)" />
  </g>
  <!-- Category Label Badge -->
  <rect x="130" y="195" width="140" height="26" rx="13" fill="#000000" opacity="0.4" />
  <text x="200" y="212" fill="#E2F4EC" font-size="12" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">FARMERS &amp; AGRI</text>
</svg>
